# Radix — HydraDB service definition.
#
# Only the database is containerised. The FastAPI backend and the Vite frontend
# stay as local dev processes so edit/reload cycles are instant; `make dev`
# orchestrates all three.
#
# Every setting below is transcribed from a live, verified-working node — see
# docs/HYDRADB_CONTRACT.md §1. The three annotated lines are the ones that look
# wrong and are not.

name: radix

services:
  hydra:
    image: ${HYDRA_IMAGE:-ghcr.io/hydra-db/hydradb:latest}
    container_name: radix-hydra
    restart: unless-stopped

    # The image declares USER 10001:10001, but Docker creates named volumes
    # root-owned. As 10001 the node boots and serves /readyz perfectly happily,
    # then silently fails every heartbeat write with "object store put failed at
    # data/_graph_nodes/v1/node-0" — a healthy-looking database that never
    # persists. Running as root is required, not a shortcut.
    user: "0:0"

    ports:
      - "${HYDRA_BOLT_PORT:-7687}:7687"    # Bolt
      - "${HYDRA_HTTP_PORT:-8443}:8443"    # HTTP JSON query API
      - "${HYDRA_ADMIN_PORT:-9090}:9090"   # admin: /readyz, /metrics

    volumes:
      # Mounted AT the data paths, never at a shared parent such as
      # /var/lib/hydra. LOCAL_PATH must already exist when the node starts or it
      # aborts with `UnableToCanonicalize { path: ..., NotFound }`; Docker
      # pre-creates a named-volume mountpoint, which is what satisfies that.
      - store:/var/lib/hydra/store
      - cache:/var/lib/hydra/cache
      # The auth token has no env-var form — it is read from this file.
      - ./hydra/auth-token:/etc/hydra/auth-token:ro

    environment:
      # Local-filesystem object store: no S3 or MinIO sidecar needed.
      CLOUD_PROVIDER: "local"
      LOCAL_PATH: "/var/lib/hydra/store"

      # Graph coordinates. These must agree with the backend's client config and
      # with the X-Graph-Namespace header on every query.
      GRAPH_NAMESPACE: "radix"
      GRAPH_ID: "default"
      GRAPH_CELL_ID: "cell-0"
      GRAPH_CELLS: "cell-0"
      GRAPH_DATA_PATH: "data"

      # Plaintext HTTP/Bolt — local development only, never a deployed setting.
      GRAPH_ALLOW_PLAINTEXT: "true"
      GRAPH_AUTH_TOKEN_FILE: "/etc/hydra/auth-token"

      GRAPH_DATA_CACHE_BYTES: "134217728"   # 128 MiB
      GRAPH_DATA_CACHE_DIR: "/var/lib/hydra/cache"

      GRAPH_NODE_ID: "node-0"
      GRAPH_BOLT_NODE_ADDRESSES: "node-0=0.0.0.0:7687"
      GRAPH_BOLT_ADDR: "0.0.0.0:7687"
      GRAPH_HTTP_ADDR: "0.0.0.0:8443"
      GRAPH_ADMIN_ADDR: "0.0.0.0:9090"
      # What Bolt clients are told to reconnect to — a host-side address, so it
      # is 127.0.0.1 rather than the container's bind address.
      GRAPH_ADVERTISED_BOLT_ADDR: "127.0.0.1:7687"

      # 32 MiB thread stacks. The async query futures overflow the default
      # stack: without this the node accepts connections and then dies on the
      # very first query.
      RUST_MIN_STACK: "33554432"
      RUST_LOG: "${RUST_LOG:-warn}"

    healthcheck:
      # The image ships neither curl nor wget, so /readyz is probed by speaking
      # HTTP/1.1 down bash's /dev/tcp and matching the status line.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9090 && printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

    # The node flushes its object store on SIGTERM; do not rush it.
    stop_grace_period: 30s

volumes:
  # Explicit names (rather than the "<project>_<key>" default) keep the volumes
  # stable no matter what directory the repo is cloned into, so a re-clone
  # re-attaches to an already-seeded graph.
  store:
    name: radix_store
  cache:
    name: radix_cache
