<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0F17" />
    <meta
      name="description"

  <body>
    <!-- Ambient chrome painted behind the app: radial vignette, drifting grid,
         and the radar sweep. Kept in the document (not React) so the first paint
         has depth before the bundle hydrates. -->

      <div class="radix-backdrop__grid"></div>
      <div class="radix-backdrop__vignette"></div>
      <div class="radix-backdrop__sweep"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
