# Radix production vhost: static frontend + /api reverse proxy to the backend.
# Mounted at /etc/nginx/conf.d/default.conf inside nginx:alpine.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Resolve `backend` per-request through Docker's embedded DNS instead of at
    # config load. This keeps `nginx -t` valid outside the compose network,
    # lets nginx start before the backend, and survives the backend container
    # changing IP on restart.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        # proxy_pass through a variable (no URI part) forwards the original
        # request URI untouched, so the backend sees its own /api/... routes.
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Closure over a large live graph can be slow; do not cut it off early.
        proxy_read_timeout 120s;
    }

    # Vite emits content-hashed filenames under /assets — cache them forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every non-file route renders the app shell.
    location / {
        try_files $uri /index.html;
    }
}
